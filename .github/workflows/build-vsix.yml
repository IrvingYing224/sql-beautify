name: Build VSIX

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:
    inputs:
      vscode-smoke:
        description: Also run the VS Code extension host smoke test (stable)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v6
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error

  vscode-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.vscode-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:vscode

  # Manual runs on main publish the package.json version as a new GitHub Release.
  release:
    needs: check
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: vsix
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          grep -Eq "^### ${version}( |$)" CHANGELOG.md || { echo "CHANGELOG.md has no ${version} entry" >&2; exit 1; }
          # A separate assignment, so that a failed query stops the job under set -e.
          tag_refs="$(git ls-remote --tags origin "refs/tags/${tag}")"
          test -z "${tag_refs}" || { echo "${tag} already exists" >&2; exit 1; }
          gh release create "${tag}" "vscode-sql-beautify-v${version}.vsix" \
            --target "${GITHUB_SHA}" --title "${tag}" --generate-notes
